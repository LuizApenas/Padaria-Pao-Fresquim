<div class="erp-shell" [class.sidebar-is-collapsed]="sidebarCollapsed" [style.--app-scale]="appScale">
  <div class="shell-overlay" [class.open]="mobileSidebarOpen" (click)="closeMobileSidebar()"></div>

  <aside class="sidebar" [class.collapsed]="sidebarCollapsed" [class.mobile-open]="mobileSidebarOpen">
    <div class="sidebar-logo">
      <img src="assets/logo.png" alt="Logo Pão FresQUIM" class="brand-logo">
      <!-- <div class="brand-copy">
        <div class="logo-text">SISTEMA</div>
        <div class="logo-text">INTEGRADO</div>
      </div> -->
    </div>

    <nav class="sidebar-nav">
      <a
        *ngFor="let item of navItems"
        class="nav-item"
        [class.nav-subitem]="item.parentId"
        routerLinkActive="active"
        [routerLink]="item.path"
        (click)="closeMobileSidebar()"
      >
        <span class="nav-glyph" [attr.aria-hidden]="true">
          <svg *ngIf="item.id === 'dashboard'" viewBox="0 0 24 24" fill="none">
            <path d="M4 4h6v6H4zM14 4h6v10h-6zM4 14h6v6H4zM14 18h6v2h-6z" />
          </svg>
          <svg *ngIf="item.id === 'clientes'" viewBox="0 0 24 24" fill="none">
            <path
              d="M16 19a4 4 0 0 0-8 0M12 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM5 18a3 3 0 0 1 3-3M19 18a3 3 0 0 0-3-3"
            />
          </svg>
          <svg *ngIf="item.id === 'produtos'" viewBox="0 0 24 24" fill="none">
            <path d="M6 4h12l-1 16H7L6 4ZM4 7h16M9 10v6M15 10v6" />
          </svg>
          <svg
            *ngIf="item.id === 'funcionarios'"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M12 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6ZM5 20v-2a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v2M7 10h2M15 10h2M7 6h2M15 6h2"
            />
          </svg>
          <svg *ngIf="item.id === 'nova-venda'" viewBox="0 0 24 24" fill="none">
            <path
              d="M5 18h14M7 18V8h10v10M9 8V6h6v2M11 12h2M12 11v2M4 18h16M6 21h12"
            />
          </svg>
          <svg *ngIf="item.id === 'historico'" viewBox="0 0 24 24" fill="none">
            <path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v5h5M12 8v5l3 2" />
          </svg>
          <svg *ngIf="item.id === 'fiado'" viewBox="0 0 24 24" fill="none">
            <path d="M5 6h14v12H5zM9 10h6M9 14h3M7 6V4M17 6V4" />
          </svg>
          <svg *ngIf="item.id === 'relatorios'" viewBox="0 0 24 24" fill="none">
            <path d="M5 4h14v16H5zM9 15v-3M12 15V9M15 15v-5" />
          </svg>
          <svg *ngIf="item.id === 'cameras'" viewBox="0 0 24 24" fill="none">
            <path d="M4 7h10l4-2v14l-4-2H4zM18 9l2 1v4l-2 1" />
          </svg>
          <svg *ngIf="item.id === 'chatbot'" viewBox="0 0 24 24" fill="none">
            <path d="M8 9V6h8v3M5 10h14v8H5zM9 14h6M12 6V4M3 12h2M19 12h2" />
          </svg>
          <svg *ngIf="item.id === 'chatbot-kpis'" viewBox="0 0 24 24" fill="none">
            <path d="M5 19V5M5 19h14M9 16v-5M13 16V8M17 16v-7" />
          </svg>
          <svg
            *ngIf="item.id === 'configuracoes'"
            viewBox="0 0 24 24"
            fill="none"
          >
            <path
              d="M12 8.5A3.5 3.5 0 1 1 8.5 12 3.5 3.5 0 0 1 12 8.5ZM19 12l2-1-1-3-2 .2a7.3 7.3 0 0 0-1.2-1.2l.2-2-3-1-1 2a7.3 7.3 0 0 0-2 0l-1-2-3 1 .2 2A7.3 7.3 0 0 0 6 8.2L4 8l-1 3 2 1a7.3 7.3 0 0 0 0 2l-2 1 1 3 2-.2a7.3 7.3 0 0 0 1.2 1.2l-.2 2 3 1 1-2a7.3 7.3 0 0 0 2 0l1 2 3-1-.2-2a7.3 7.3 0 0 0 1.2-1.2l2 .2 1-3-2-1a7.3 7.3 0 0 0 0-2Z"
            />
          </svg>
          <svg *ngIf="item.id === 'chatbot-fluxo'" viewBox="0 0 24 24" fill="none">
            <path d="M7 4h10v16H7zM9 8h6M9 12h6M9 16h4M5 6h2M5 10h2M5 14h2" />
          </svg>
        </span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </nav>

    <a class="nav-new-sale" routerLink="/vendas/nova" (click)="closeMobileSidebar()">
      <span>+</span>
      <span class="nav-label">NOVA VENDA</span>
    </a>

    <button class="sidebar-toggle" type="button" (click)="toggleSidebar()" [attr.aria-label]="sidebarCollapsed ? 'Expandir menu' : 'Recolher menu'">
      <svg viewBox="0 0 24 24" fill="none">
        <path *ngIf="!sidebarCollapsed" d="M15 18l-6-6 6-6"/>
        <path *ngIf="sidebarCollapsed"  d="M9 18l6-6-6-6"/>
      </svg>
    </button>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="topbar-icon topbar-menu" type="button" aria-label="Abrir menu" (click)="toggleMobileSidebar()">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>

      <div class="topbar-title">Portal Administrativo</div>

      <label class="topbar-search-wrap">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M11 5a6 6 0 1 0 0 12 6 6 0 0 0 0-12ZM20 20l-4.2-4.2" />
          </svg>
        </span>
        <input
          class="topbar-search"
          type="text"
          placeholder="Buscar em ERP..."
        />
      </label>

      <div class="topbar-right">
        <div class="topbar-zoom">
          <span class="zoom-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path
                d="M11 5a6 6 0 1 0 0 12 6 6 0 0 0 0-12ZM20 20l-4.2-4.2M9 11h4M11 9v4"
              />
            </svg>
          </span>
          <button class="zoom-link zoom-step" type="button" (click)="decreaseZoom()" aria-label="Reduzir zoom">-</button>
          <button class="zoom-link" [class.active]="zoom() === 100" type="button" (click)="setPresetZoom(100)">100%</button>
          <button class="zoom-link zoom-step" type="button" (click)="increaseZoom()" aria-label="Aumentar zoom">+</button>
          <div class="zoom-custom">
            <input
              class="zoom-input"
              type="number"
              min="50"
              max="200"
              [(ngModel)]="zoomInput"
              (blur)="applyCustomZoom()"
              (keyup.enter)="applyCustomZoom()"
              aria-label="Zoom personalizado"
            />
            <span class="zoom-suffix">%</span>
          </div>
        </div>

        <button class="topbar-icon" type="button" aria-label="Notificacoes">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M12 4a4 4 0 0 0-4 4v2.6c0 .7-.2 1.4-.6 2L6 15h12l-1.4-2.4c-.4-.6-.6-1.3-.6-2V8a4 4 0 0 0-4-4ZM10 18a2 2 0 0 0 4 0"
            />
          </svg>
        </button>

        <button
          class="topbar-icon"
          [class.active]="isThemeMode('dark')"
          type="button"
          aria-label="Modo escuro"
          title="Modo escuro"
          (click)="setThemeMode(isThemeMode('dark') ? 'light' : 'dark')"
        >
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 1 0 9.8 9.8Z" />
          </svg>
        </button>

        <button
          class="topbar-icon"
          [class.active]="isThemeMode('contrast')"
          type="button"
          aria-label="Modo contraste"
          title="Modo contraste"
          (click)="setThemeMode(isThemeMode('contrast') ? 'light' : 'contrast')"
        >
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9Zm0 18V3" />
          </svg>
        </button>

        <button class="topbar-icon" type="button" aria-label="Atalhos do sistema" title="Atalhos do sistema" (click)="toggleShortcuts()">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M4 6h16v12H4zM7 9h.01M10 9h.01M13 9h.01M16 9h.01M7 12h.01M10 12h.01M13 12h.01M16 12h.01M8 15h8" />
          </svg>
        </button>

        <button class="topbar-icon" type="button" aria-label="Ajuda" title="Ajuda da Fresca" (click)="toggleHelp()">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 18h.01M9.1 9a3 3 0 1 1 5.8 1c-.5 1.2-1.9 1.7-2.4 2.8-.2.3-.2.7-.2 1.2M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20Z" />
          </svg>
        </button>

        <div class="admin-chip topbar-divider">
          <div class="admin-info">
            <div class="admin-name">{{ userDisplayName }}</div>
            <div class="admin-unit">{{ userSubtitle }}</div>
            <div class="admin-email" *ngIf="userEmail">{{ userEmail }}</div>
          </div>
          <div class="admin-avatar" [attr.title]="userEmail">{{ userInitials }}</div>
          <button class="logout-btn" type="button" (click)="logout()">Sair</button>
        </div>
      </div>
    </header>

    <section class="page">
      <div class="page-breadcrumb-bar">
        <p-breadcrumb
          class="pf-breadcrumb"
          [home]="breadcrumbHome"
          [model]="breadcrumbItems"
        />
        <h1 class="page-current-title">{{ currentPage.label }}</h1>
      </div>
      <router-outlet></router-outlet>
    </section>
  </main>

  <pf-help-drawer [open]="helpOpen" [page]="currentPageId" (close)="closeHelp()"></pf-help-drawer>

  <div *ngIf="shortcutsOpen" class="shortcut-overlay" (click)="closeShortcuts()" role="presentation"></div>
  <section *ngIf="shortcutsOpen" class="shortcut-modal" role="dialog" aria-modal="true" aria-label="Atalhos do sistema">
    <button class="shortcut-close" type="button" (click)="closeShortcuts()" aria-label="Fechar atalhos">x</button>
    <header class="shortcut-head">
      <h2>Atalhos do sistema</h2>
      <p>Use as teclas de funcao fora dos campos de texto para navegar mais rapido.</p>
    </header>

    <div class="shortcut-grid">
      <button
        *ngFor="let item of shortcuts"
        class="shortcut-item"
        type="button"
        (click)="navigateShortcut(item)"
      >
        <span class="shortcut-key">{{ item.key }}</span>
        <span class="shortcut-label">{{ item.label }}</span>
      </button>
    </div>

    <footer class="shortcut-footer">
      <span>Esc fecha janelas abertas. ? mostra esta ajuda.</span>
      <button class="shortcut-help-link" type="button" (click)="openHelpFromShortcuts()">Fresca Ajuda</button>
    </footer>
  </section>
</div>
