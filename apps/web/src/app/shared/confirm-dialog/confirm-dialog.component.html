<div
  *ngIf="confirmService.dialog() as dialog"
  class="confirm-backdrop"
  role="presentation"
  (click)="confirmService.cancel()"
>
  <section
    class="confirm-dialog"
    role="alertdialog"
    aria-modal="true"
    [attr.aria-label]="dialog.title"
    (click)="$event.stopPropagation()"
  >
    <div class="confirm-icon" [class.danger]="dialog.tone === 'danger'" aria-hidden="true">!</div>
    <div class="confirm-copy">
      <h2>{{ dialog.title }}</h2>
      <p>{{ dialog.message }}</p>
    </div>
    <div class="confirm-actions">
      <button class="btn-secondary" type="button" (click)="confirmService.cancel()">
        {{ dialog.cancelLabel }}
      </button>
      <button
        class="btn-primary"
        [class.confirm-danger]="dialog.tone === 'danger'"
        type="button"
        autofocus
        (click)="confirmService.confirm()"
      >
        {{ dialog.confirmLabel }}
      </button>
    </div>
  </section>
</div>
